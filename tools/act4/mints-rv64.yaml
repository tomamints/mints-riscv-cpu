params:
  MXLEN: 64
  UXLEN: [64]
  SXLEN: [64]
  ASID_WIDTH: 16
  SATP_MODE_BARE: true
  NON_STANDARD_EXTENSION_IMPLEMENTED: false
  PHYS_ADDR_WIDTH: 56
  PMA_GRANULARITY: 3
  M_MODE_ENDIANNESS: little
  S_MODE_ENDIANNESS: little
  U_MODE_ENDIANNESS: little
  MISA_CSR_IMPLEMENTED: true
  MUTABLE_MISA_A: false
  MUTABLE_MISA_C: false
  MUTABLE_MISA_M: false
  MUTABLE_MISA_S: false
  MUTABLE_MISA_U: false
  PRECISE_SYNCHRONOUS_EXCEPTIONS: true
  TRAP_ON_ECALL_FROM_M: true
  TRAP_ON_ECALL_FROM_S: true
  TRAP_ON_ECALL_FROM_U: true
  TRAP_ON_EBREAK: true
  MEDELEG_DELEGATABLE: [true, true, true, true, true, true, true, true, true, true, false, false, true, true, false, true, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false, false]
